<script>

function noteFragmentText(fragment) {

// Grammatica unica per la ricerca nelle applicazioni: parole, frasi e AND.
function parseSearchQuery(query='') {
  return (query.match(/"[^"]*"|\S+/g)||[]).filter(term=>term.toUpperCase()!=='AND').map(term=>term.replace(/^"|"$/g,'').toLocaleLowerCase('it'));

// Ogni file è indipendente: attività ed eliminazioni restano sempre nello stesso documento.
const StorageFiles = {
  names: { activities:'attivita.json', general:'generale.json', notes:'note.json' },
  encode(data) {
    return {
      activities:{format:'spazio.activities',version:1,updatedAt:data.activitiesUpdatedAt,tasks:data.tasks,tombstones:data.tombstones},
      notes:{format:'spazio.notes',version:1,updatedAt:data.notesUpdatedAt,journal:Object.fromEntries(data.notes.documents.filter(doc=>doc.kind==='journal').map(doc=>[doc.date,doc])),archive:data.notes.documents.filter(doc=>doc.kind==='archive'),tombstones:data.notes.tombstones},
      general:{format:'spazio.general',version:1,updatedAt:data.preferencesUpdatedAt,preferences:data.preferences}
    };
  },
  decode(parts) {
    const data=WorkspaceData.empty();
    for(const kind of ['activities','general','notes']) {
      const part=parts[kind];
      if(!(kind in parts))continue;
      if(!part || part.format!==`spazio.${kind}` || part.version!==1 || typeof part.updatedAt!=='string')throw Error(`${this.names[kind]}: formato o versione non supportati.`);
      if(kind==='activities') {
        if(!part.tombstones)throw Error('attivita.json: registro delle eliminazioni assente.');
        Object.assign(data,{tasks:part.tasks,tombstones:part.tombstones,activitiesUpdatedAt:part.updatedAt});
      } else if(kind==='notes'){
        let notes=part.notes;
        if(notes===undefined){
          if(!part.journal||typeof part.journal!=='object'||Array.isArray(part.journal)||!Array.isArray(part.archive)||!part.tombstones)throw Error('note.json: documenti incompleti.');
          for(const[date,doc]of Object.entries(part.journal))if(doc?.kind!=='journal'||doc.date!==date)throw Error('note.json: indice Journal incoerente.');
          if(part.archive.some(doc=>doc?.kind!=='archive'))throw Error('note.json: Archivio incoerente.');
          notes={documents:[...Object.values(part.journal),...part.archive],tombstones:part.tombstones};
        }
        Object.assign(data,{notes,notesUpdatedAt:part.updatedAt});
      }
      else Object.assign(data,{preferences:part.preferences,preferencesUpdatedAt:part.updatedAt});
    }
    data.updatedAt=[data.activitiesUpdatedAt,data.preferencesUpdatedAt,data.notesUpdatedAt].sort().at(-1);
    return WorkspaceData.validate(data);
  }
};

function createFolderStorage() {
  const maxBytes=50*1024*1024;
  async function fileText(file) {
    const contents=await file.getFile();
    if(contents.size>maxBytes)throw Error('Archivio troppo grande (massimo 50 MB).');
    return {text:await contents.text(),size:contents.size};
  }
  async function read(handle) {
    let directory;
    try { directory=await handle.getDirectoryHandle('spazio-dati'); }
    catch(error) { if(error.name==='NotFoundError')return {data:null,parts:{},raw:{},sizes:{}};throw error; }
    const entries=await Promise.all(Object.entries(StorageFiles.names).map(async([kind,name])=>{
      let file;
      try { file=await directory.getFileHandle(name); }
      catch(error) {if(error.name==='NotFoundError')return [kind,null];throw error;}
      const contents=await fileText(file);
      if(!contents.size)return [kind,null];
      try { return [kind,{...contents,value:JSON.parse(contents.text)}]; }
      catch(error) {throw Error(`${name}: JSON non valido. I file non sono stati sovrascritti.`,{cause:error});}

  }

    const encoded=StorageFiles.encode(data),before=previous.data?StorageFiles.encode(previous.data):{},pending=[];
    let total=0;
    for(const[kind,part]of Object.entries(encoded)){
      const unchanged=previous.parts[kind]&&part.updatedAt===before[kind].updatedAt&&(kind==='activities'?WorkspaceData.sameActivities(data,previous.data):kind==='notes'?NotesData.same(data.notes,previous.data.notes):data.preferences.theme===previous.data.preferences.theme);

      const text=JSON.stringify(part);total+=new TextEncoder().encode(text).byteLength;pending.push({kind,text});

    if(!pending.length)return;
    const directory=await handle.getDirectoryHandle('spazio-dati',{create:true}),expected={...previous.raw};
    for(const{kind,text}of pending){
      const name=StorageFiles.names[kind],file=await directory.getFileHandle(name,{create:true});
      const check=async()=>{if((await fileText(file)).text!==(previous.raw[kind]??''))throw Error(name+' è cambiato durante il salvataggio. Checkpoint conservato nel browser.');};
      await check();const stream=await file.createWritable({mode:'exclusive'});
      try{await check();await stream.write(text);await stream.close();}
      catch(error){try{await stream.abort();}catch{}throw error;}
      expected[kind]=text;
    }
    // Controlla anche i file non modificati: un altro programma può averli cambiati
    // mentre veniva scritto un dominio diverso. Il checkpoint precede tutti i file.
    const verified=await read(handle);
    if(Object.keys(StorageFiles.names).some(kind=>verified.raw[kind]!==expected[kind]))throw Error('Verifica dei file non riuscita. Checkpoint conservato nel browser.');
  }
  async function assetsDirectory(handle,create=false) {
    const data=await handle.getDirectoryHandle('spazio-dati',{create});
    const assets=await data.getDirectoryHandle('assets',{create});
    return assets.getDirectoryHandle('note',{create});
  }
  async function findAsset(handle,id){try{return await (await (await assetsDirectory(handle)).getFileHandle(id)).getFile();}catch(error){if(error.name==='NotFoundError')return null;throw error;}}
  async function readAsset(handle,id,existing=null) {
    const file=existing||await findAsset(handle,id);
    if(!file||!file.size||file.size>maxAssetBytes)throw Error('Immagine mancante o troppo grande.');
    if(file.type)return file;
    const bytes=new Uint8Array(await file.slice(0,12).arrayBuffer());
    const type=bytes[0]===137&&bytes[1]===80?'image/png':bytes[0]===255&&bytes[1]===216?'image/jpeg':bytes[0]===71&&bytes[1]===73?'image/gif':bytes[0]===82&&bytes[8]===87?'image/webp':'';
    if(!type)throw Error('Formato immagine non riconosciuto.');return new Blob([file],{type});
  }
  async function writeAsset(handle,id,blob) {
    const directory=await assetsDirectory(handle,true);
    let file; file=await directory.getFileHandle(id,{create:true});const stream=await file.createWritable();
    try{await stream.write(blob);await stream.close();}catch(error){try{await stream.abort();}catch{}throw error;}
  }
  // La pulizia è esplicita e avviene dopo aver salvato il documento che rimuove i riferimenti.
  async function cleanAssets(handle,referenced) {
    let directory;try{directory=await assetsDirectory(handle);}catch(error){if(error.name==='NotFoundError')return;throw error;}
    for await(const[name]of directory.entries())if(/^[a-f0-9]{64}$/.test(name)&&!referenced.has(name)){const file=await(await directory.getFileHandle(name)).getFile();if(file.lastModified&&Date.now()-file.lastModified>7*86400000)await directory.removeEntry(name);}

// Contenitore binario semplice: intestazione JSON e allegati concatenati, senza Base64.
// Il JSON storico resta importabile ed esportabile se non sono presenti allegati.
async function exportWorkspaceBackup(repository) {
  await repository.reload();await repository.flush();const data=repository.getSnapshot(),ids=[...NotesData.assets(data)];
  if(!ids.length){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});if(blob.size>50*1024*1024)throw Error('Il JSON supera il limite di 50 MB.');return {blob,extension:'json'};}
  const blobs=[],assets=[];
  for(const id of ids){const blob=await repository.getAsset(id);blobs.push(blob);assets.push({id,type:blob.type,size:blob.size});}
  const metadata=new TextEncoder().encode(JSON.stringify({format:'spazio.backup',version:1,data,assets}));
  if(metadata.byteLength>50*1024*1024||12+metadata.byteLength+blobs.reduce((size,blob)=>size+blob.size,0)>250*1024*1024)throw Error('Il backup supera il limite di 250 MB o il JSON supera 50 MB.');
  const prefix=new Uint8Array(12);prefix.set(new TextEncoder().encode('SPAZIO01'));new DataView(prefix.buffer).setUint32(8,metadata.byteLength,true);
  return {blob:new Blob([prefix,metadata,...blobs],{type:'application/octet-stream'}),extension:'spazio'};
}
async function readWorkspaceBackup(file) {
  if(file.size>250*1024*1024)throw Error('Il backup supera il limite di 250 MB.');
  const prefix=new Uint8Array(await file.slice(0,12).arrayBuffer());
  if(new TextDecoder().decode(prefix.slice(0,8))!=='SPAZIO01'){
    if(file.size>50*1024*1024)throw Error('Il JSON supera il limite di 50 MB.');
    return {data:WorkspaceData.validate(JSON.parse(await file.text())),assets:[]};
  }
  if(prefix.length<12)throw Error('Intestazione del backup incompleta.');
  const length=new DataView(prefix.buffer).getUint32(8,true);if(length>50*1024*1024||12+length>file.size)throw Error('Intestazione del backup non valida.');
  const envelope=JSON.parse(await file.slice(12,12+length).text());
  if(envelope.format!=='spazio.backup'||envelope.version!==1||!Array.isArray(envelope.assets))throw Error('Backup non supportato.');
  const data=WorkspaceData.validate(envelope.data),assets=[],seen=new Set();let offset=12+length;
  for(const asset of envelope.assets){
    if(!asset||!/^[a-f0-9]{64}$/.test(asset.id)||seen.has(asset.id)||!assetTypes.includes(asset.type)||!Number.isSafeInteger(asset.size)||asset.size<1||asset.size>maxAssetBytes||offset+asset.size>file.size)throw Error('Allegato del backup non valido.');
    const blob=file.slice(offset,offset+asset.size,asset.type);offset+=asset.size;
    const id=await hashAsset(blob);
    if(id!==asset.id)throw Error('Backup danneggiato: immagine non corrispondente.');
    seen.add(id);assets.push({id,blob});
  }
  if(offset!==file.size||[...NotesData.assets(data)].some(id=>!seen.has(id)))throw Error('Backup incompleto.');
  return {data,assets};
}

function localDate(year, monthIndex, day = 1) {

}

const noteTextCache=new Map();


const noteHighlightColor='rgb(235, 235, 233)';
function sanitizeNote(html){
  if(!html)return '';
  const source=document.createElement('template');source.innerHTML=html;
  const target=document.createElement('div');
  const pending=Array.from(source.content.childNodes).reverse().map(node=>({node,parent:target}));
  while(pending.length){
    const {node,parent}=pending.pop();
    if(node.nodeType===3){parent.append(document.createTextNode(node.textContent));continue;}
    if(node.nodeType!==1)continue;
    const name=node.tagName.toUpperCase();
    if(['SCRIPT','STYLE','IFRAME','OBJECT','SVG','MATH','TEMPLATE','NOSCRIPT','HEAD','LINK','META','BASE'].includes(name))continue;
    const highlighted=name==='MARK'||(name==='SPAN'&&node.style.backgroundColor===noteHighlightColor);
    const tag=highlighted?'span':{B:'strong',STRONG:'strong',UL:'ul',LI:'li',P:'p',DIV:'div',BR:'br',H1:'h1',H2:'h2',H3:'h3',PRE:'pre',CODE:'code',HR:'hr',FIGURE:'figure',IMG:'img'}[name];
    const element=tag?document.createElement(tag):parent;if(tag)parent.append(element);
    if(tag){
      if(highlighted)element.style.backgroundColor=noteHighlightColor;
      if(tag==='pre'&&/^[\w+#.-]{0,32}$/.test(node.getAttribute('data-language')||''))element.dataset.language=node.getAttribute('data-language')||'';
      if(tag==='img'){
        const asset=node.getAttribute('data-asset-id');
        if(!/^[a-f0-9]{64}$/.test(asset||'')){element.remove();continue;}
        element.dataset.assetId=asset;element.alt=(node.getAttribute('alt')??'Immagine').slice(0,240);
        element.dataset.size=['small','medium','large'].includes(node.dataset.size)?node.dataset.size:'medium';
        for(const key of ['width','height']){const value=Number(node.getAttribute(key));if(Number.isFinite(value)&&value>0&&value<=30000)element.setAttribute(key,String(value));}
      }
    }
    for(let index=node.childNodes.length-1;index>=0;index--)pending.push({node:node.childNodes[index],parent:element});
  }
  // Il codice resta un unico paragrafo: i contenitori storici interni bloccano formatBlock in WebKit.
  for(const code of target.querySelectorAll('pre'))if(code.querySelector('div,p,h1,h2,h3,ul,ol')&&!code.querySelector('img,figure,hr')){
    code.textContent=codePlainText(code);if(!code.textContent)code.append(document.createElement('br'));
  }
  return target.innerHTML;
}
function noteText(html){
  if(!html)return '';
  if(noteTextCache.has(html))return noteTextCache.get(html);
  const template=document.createElement('template');
  template.innerHTML=sanitizeNote(html);
  template.content.querySelectorAll('p,div,li,h1,h2,h3,pre,br,figure').forEach(node=>node.append(' '));
  const text=(template.content.textContent+(template.content.querySelector('img')?' Immagine':'')+(template.content.querySelector('hr')?' Divisore':'')).trim();
  // Il limite evita di trattenere in memoria un secondo archivio di note lunghe.
  if(html.length<=16000){
    if(noteTextCache.size>=128)noteTextCache.delete(noteTextCache.keys().next().value);
    noteTextCache.set(html,text);
  }
  return text;
}
function clearNoteCache(){noteTextCache.clear();}



let titlePreview = null;
let previewTrigger = null;
let previewHideTimer;

function hideTitlePreview() {
  clearTimeout(previewHideTimer);
  if (previewTrigger) {
    const descriptions = (previewTrigger.getAttribute('aria-describedby') || '').split(/\s+/).filter(id => id && id !== 'activity-title-preview');
    if (descriptions.length) previewTrigger.setAttribute('aria-describedby', descriptions.join(' '));
    else previewTrigger.removeAttribute('aria-describedby');
  }
  previewTrigger = null;
  if (titlePreview) {
    titlePreview.hidden = true;
    titlePreview.textContent = '';
  }
}

function getTitlePreview() {
  if (titlePreview) return titlePreview;
  // Un solo tooltip per tutte le righe; nessun osservatore per ciascuna attività.
  titlePreview = document.createElement('div');
  titlePreview.id = 'activity-title-preview';
  titlePreview.className = 'title-preview';
  titlePreview.setAttribute('role', 'tooltip');
  titlePreview.hidden = true;
  titlePreview.addEventListener('pointerenter', () => clearTimeout(previewHideTimer));
  titlePreview.addEventListener('pointerleave', () => {
    if (document.activeElement !== previewTrigger) hideTitlePreview();
  });
  document.body.append(titlePreview);
  document.addEventListener('pointerdown', event => {
    if (!titlePreview.contains(event.target)) hideTitlePreview();
  }, true);
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') hideTitlePreview();
  });
  document.addEventListener('scroll', event => {
    if (!titlePreview.contains(event.target)) hideTitlePreview();
  }, true);
  window.addEventListener('resize', hideTitlePreview);
  return titlePreview;
}

function showTitlePreview(button, text) {
  hideTitlePreview();
  if (!text || !button.isConnected || document.querySelector('dialog[open]')) return;
  const preview = getTitlePreview();
  previewTrigger = button;
  preview.textContent = text;
  preview.hidden = false;
  const descriptions = new Set((button.getAttribute('aria-describedby') || '').split(/\s+/).filter(Boolean));
  descriptions.add(preview.id);
  button.setAttribute('aria-describedby', [...descriptions].join(' '));
  const anchor = button.getBoundingClientRect();
  const size = preview.getBoundingClientRect();
  preview.style.left = `${Math.max(12, Math.min(anchor.left, innerWidth - size.width - 12))}px`;
  preview.style.top = `${anchor.bottom + size.height + 8 <= innerHeight - 12 ? anchor.bottom + 8 : Math.max(12, anchor.top - size.height - 8)}px`;
}

function previewTitle(button,readOnly=false){
  showTitlePreview(button,button.scrollWidth>button.clientWidth?button.textContent:readOnly?'Ripristina l’attività per modificarla':'');
}
function scheduleTitleHide(button,blur=false){
  if(previewTrigger!==button)return;
  if(blur)hideTitlePreview();
  else if(document.activeElement!==button)previewHideTimer=setTimeout(()=>{if(previewTrigger===button)hideTitlePreview();},120);
}
function initTitlePreview(root){
  for(const type of ['pointerover','focusin'])root.addEventListener(type,event=>{
    const button=event.target.closest('.title-trigger');if(button)previewTitle(button,button.disabled);
  });
  for(const type of ['pointerout','focusout'])root.addEventListener(type,event=>{
    if(event.target.matches('.title-trigger'))scheduleTitleHide(event.target,type==='focusout');

function beginTitleEdit(button, onSave) {
  hideTitlePreview();
  const original = button.textContent;
  const input = document.createElement('input');
  input.className = 'title-input';
  input.value = original;
  input.maxLength = 240;
  input.setAttribute('aria-label', 'Modifica titolo dell’attività');
  let finished = false;
  function finish(save) {
    if (finished) return;
    finished = true;
    const title = input.value.trim();
    input.replaceWith(button);
    if (save && title && title !== original) onSave(title);
  }
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', event => {
    if (event.isComposing || !['Enter', 'Escape'].includes(event.key)) return;
    event.preventDefault();
    finish(event.key === 'Enter');
    button.focus({ preventScroll: true });
    hideTitlePreview();
  });
  button.replaceWith(input);
  input.focus({ preventScroll: true });
  input.setSelectionRange(input.value.length, input.value.length);
  return input;
}

// La selezione visiva precede il salvataggio. Una risposta vecchia non deve
// annullare una scelta successiva o riaprire un calendario già chiuso.
function createDateSelection({ paint, save, read, isActive }) {
  let revision = 0;
  return {
    async select(value) {
      const request = ++revision;
      paint(value);
      try {
        await save(value);
      } catch (error) {
        if (request === revision && isActive()) paint(read());
        throw error;
      }
    }
  };
}

// Il salvataggio può sostituire la riga: il popover resta aperto e si ancora
// al nuovo controllo, senza spostare il focus dal giorno selezionato.
function rebindDateAnchor(state, row) {
  const trigger = row?.querySelector('.due-chip');
  if (!trigger || trigger.disabled || row.hidden) return false;
  state.trigger?.setAttribute('aria-expanded', 'false');
  state.row = row;
  state.trigger = trigger;
  trigger.setAttribute('aria-expanded', 'true');
  return true;
}

// Salva uno snapshot, senza perdere il testo aggiunto durante l'attesa né
// chiudere una nota aperta successivamente nella stessa finestra.
async function saveNoteSnapshot({ editor, persist, isCurrent, onSaved, onClose, readHTML=()=>sanitizeNote(editor.innerHTML) }) {
  const html=readHTML(), note=noteText(html)?html:'';
  if(note.length>200000)throw Error('La nota è troppo lunga (massimo 200.000 caratteri).');
  await persist(note);
  if(!isCurrent())return;
  onSaved(note,html);
  if(sanitizeNote(editor.innerHTML)===html)onClose();
}

};

            openCursor(){
              const result={};operations++;let entries,index=0;
              const advance=()=>previous.then(()=>queueMicrotask(()=>{
                if(aborted)return;pending??=new Map(data);entries??=[...pending];const entry=entries[index++];
                result.result=entry?{key:entry[0],value:clone(entry[1],entry[0]),delete:()=>pending.delete(entry[0]),continue:advance}:null;
                result.onsuccess?.();if(!entry){operations--;finish();}
              }));advance();return result;
            },
            delete(key){operations++;previous.then(()=>queueMicrotask(()=>{if(aborted)return;pending??=new Map(data);pending.delete(key);operations--;finish();}));},
            put(value,key){factory.writeCalls++;factory.writeKeys.push(key);operations++;previous.then(()=>queueMicrotask(()=>{if(aborted)return;pending??=new Map(data);pending.set(key,clone(value,key));operations--;finish();}));}
          });return tx;
        }};
        connections.add(req.result);req.onupgradeneeded?.();req.onsuccess?.();
      });return req;
    }
  };
  return factory;
}

const missing=()=>new DOMException('Assente','NotFoundError');
class Folder {
  name='Prova';files=new Map();directories=new Set();writes=[];reads=[];bytesWritten=0;failWrite=false;failOn=null;permission='granted';afterClose=null;beforeWrite=null;
  async queryPermission(){return this.permission;}
  seed(data){this.directories.add('spazio-dati');for(const[kind,part]of Object.entries(StorageFiles.encode(data)))this.files.set('spazio-dati/'+StorageFiles.names[kind],JSON.stringify(part));}
  async getDirectoryHandle(name,{create=false}={}){
    if(this.permission!=='granted')throw new DOMException('Permesso revocato','NotAllowedError');
    if(!this.directories.has(name)){if(!create)throw missing();this.directories.add(name);}
    return this.directoryHandle(name);
  }
  directoryHandle(path){const thisFolder=this;return {
    getDirectoryHandle:async(name,{create=false}={})=>{const child=path+'/'+name;if(!this.directories.has(child)){if(!create)throw missing();this.directories.add(child);}return this.directoryHandle(child);},
    getFileHandle:(file,options)=>this.fileHandle(path+'/'+file,options),
    entries:async function*(){for(const key of thisFolder.files.keys())if(key.startsWith(path+'/')&&!key.slice(path.length+1).includes('/'))yield [key.slice(path.length+1),{}];},
    removeEntry:async name=>this.files.delete(path+'/'+name)
  };}
  async getFileHandle(name,options){return this.fileHandle(name,options);}
  async fileHandle(path,{create=false}={}){
    if(!this.files.has(path)){if(!create)throw missing();this.files.set(path,'');}
    const folder=this;
    return {
      async getFile(){folder.reads.push(path);const text=folder.files.get(path);return text instanceof Blob?text:{size:new TextEncoder().encode(text).byteLength,text:async()=>text};},
      async createWritable(){
        if(folder.failWrite||folder.failOn===path)throw Error('Disco non disponibile');
        await folder.beforeWrite?.(path);
        let buffer;
        return {
          async write(value){buffer=value;},
          async close(){folder.files.set(path,buffer);folder.writes.push(path);folder.bytesWritten+=(buffer instanceof Blob?buffer.size:new TextEncoder().encode(buffer).byteLength);await folder.afterClose?.(path);},
          async abort(){}
        };
      }
    };
  }
}
function repo(indexedDB=memoryIDB(),events=[],locks=memoryLocks()){return createRepository({indexedDB,locks,onStatus:(text,error)=>events.push({text,error})});}

test('dimensioni eccessive: rifiuta i file prima di modificarli',async()=>{
  class OversizedFolder extends Folder {
    async getDirectoryHandle(name,options){
      const directory=await super.getDirectoryHandle(name,options);
      return {getFileHandle:async(file,settings)=>{
        const handle=await directory.getFileHandle(file,settings),original=handle.getFile;
        handle.getFile=async()=>({...await original(),size:51*1024*1024});
        return handle;
      }};
    }
  }
  const store=repo(),folder=new OversizedFolder();folder.seed(dataset([task()]));await store.initialize();
  await assert.rejects(store.switchFolder(folder));assert.equal(folder.writes.length,0);assert.equal(store.getSnapshot().tasks.length,0);
});

test('browser ↔ cartella: tutti i dati seguono la destinazione anche dopo modifiche e riavvii',async()=>{
  const db=memoryIDB(),locks=memoryLocks(),store=repo(db,[],locks),folder=new Folder();
  await store.initialize();
  await store.mutate(data=>{
    data.tasks.push(task('active'),task('archive',{archivedAt:stamp}),task('trash',{deletedAt:stamp}));
    data.tombstones.removed=stamp;data.preferences.theme='dark';
  });
  await store.switchFolder(folder);
  const disk=StorageFiles.decode({activities:JSON.parse(folder.files.get('spazio-dati/attivita.json')),general:JSON.parse(folder.files.get('spazio-dati/generale.json'))});
  assert.ok(WorkspaceData.sameActivities(store.getSnapshot(),disk));assert.equal(disk.preferences.theme,'dark');
  // Una modifica già presente nella cartella deve seguire anche il ritorno al browser.
  WorkspaceData.changeTask(disk,'active',{note:'<p><strong>Modifica nella cartella</strong></p>'});
  folder.seed(disk);await store.switchBrowser();
  assert.equal(store.getSnapshot().tasks.find(item=>item.id==='active').note,'<p><strong>Modifica nella cartella</strong></p>');
  const detached=JSON.stringify([...folder.files]);
  await store.mutate(data=>{
    WorkspaceData.changeTask(data,'active',{title:'Modifica nel browser',note:'<p>Nota finale</p>'});
    WorkspaceData.purgeTasks(data,['trash']);data.tasks.push(task('new'));data.preferences.theme='light';
  });
  assert.equal(JSON.stringify([...folder.files]),detached);
  const cached=repo(db,[],locks);await cached.initialize();assert.equal(cached.getConfig().mode,'browser');
  await cached.switchFolder(folder);
  const reopened=repo(db,[],locks);await reopened.initialize();
  const result=reopened.getSnapshot();
  assert.equal(result.tasks.length,3);assert.equal(result.tasks.find(item=>item.id==='active').title,'Modifica nel browser');
  assert.equal(result.tasks.find(item=>item.id==='active').note,'<p>Nota finale</p>');
  assert.equal(result.tasks.find(item=>item.id==='archive').archivedAt,stamp);
  assert.ok(result.tasks.some(item=>item.id==='new'));assert.ok(!result.tasks.some(item=>item.id==='trash'));
  assert.equal(result.tombstones.removed,stamp);assert.ok(result.tombstones.trash);assert.equal(result.preferences.theme,'light');
  const saved=StorageFiles.decode({activities:JSON.parse(folder.files.get('spazio-dati/attivita.json')),general:JSON.parse(folder.files.get('spazio-dati/generale.json'))});
  assert.ok(WorkspaceData.sameActivities(result,saved));assert.equal(saved.preferences.theme,'light');
});

testArea('Editor delle note', () => {
async function withNoteToolbar(action) {
  const dialog = document.createElement('dialog');
  dialog.innerHTML = '<div role="group"><button type="button" data-note-format="normal">Testo normale</button><button type="button" data-note-format="bold">Grassetto</button><button type="button" data-note-format="list">Elenco puntato</button></div><div contenteditable="true" role="textbox" style="height:180px;white-space:pre-wrap"></div><button type="button">Fuori</button>';
  document.body.append(dialog);
  const [toolbar, editor, outside] = dialog.children;
  const controller = attachNoteToolbar({ editor, toolbar });
  dialog.showModal();
  editor.focus();
  const selection = window.getSelection();
  function select(start, from, end = start, to = from) {
    const range = document.createRange();
    range.setStart(start, from); range.setEnd(end, to);
    selection.removeAllRanges(); selection.addRange(range);
    controller.refresh();
  }
  function caret(node, offset = node.nodeType === 3 ? node.length : node.childNodes.length) { select(node, offset); }
  function html(value) {
    controller.reset(); editor.innerHTML = value; editor.focus();
    let last = editor; while (last.lastChild && last.lastChild.nodeName !== 'BR') last = last.lastChild;
    caret(last);
  }
  const button = format => toolbar.querySelector(`[data-note-format="${format}"]`);
  function click(format) { controller.refresh(); button(format).click(); }
  function key(value, modifiers = {}, target = editor) {
    const event = new KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true, ...modifiers });
    target.dispatchEvent(event); return event;
  }
  function input(inputType, data = null, options = {}) {
    const event = new InputEvent('beforeinput', { inputType, data, bubbles: true, cancelable: true, ...options });
    editor.dispatchEvent(event); return event;
  }
  const type = value => document.execCommand('insertText', false, value);
  try { await action({ dialog, toolbar, editor, outside, controller, selection, select, caret, html, button, click, key, input, type }); }
  finally { controller.destroy(); dialog.close(); dialog.remove(); selection.removeAllRanges(); }
}

async function imageFile(name='foto.png',width=120,height=60){
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const context=canvas.getContext('2d');context.fillStyle='#d8a34b';context.fillRect(0,0,width,height);
  return new File([await new Promise(resolve=>canvas.toBlob(resolve,'image/png'))],name,{type:'image/png'});
}
async function withNoteEditor(action,options={}){
  const host=document.createElement('div');host.className='shared-editor-host';host.style.cssText='position:relative;height:420px;display:flex;flex-direction:column';
  host.innerHTML='<div class="note-toolbar"></div><div class="note-editor" style="min-height:200px" role="textbox" contenteditable="true"></div>';document.body.append(host);
  const [toolbar,editor]=host.children,assets=new Map(),errors=[];let changes=0;
  const repository={getAsset:async id=>assets.get(id),putAsset:async blob=>{const id=await hashAsset(blob);assets.set(id,blob);return id;},...options.repository};
  const controller=createNoteEditor({editor,toolbar,getRepository:()=>repository,onError:error=>errors.push(error),onChange:()=>changes++,...options});
  function caret(node=editor,offset=node.nodeType===3?node.length:node.childNodes.length){editor.focus();const range=document.createRange();range.setStart(node,offset);range.collapse(true);getSelection().removeAllRanges();getSelection().addRange(range);}
  function paste(files=[],html='',text=''){const data=new DataTransfer();for(const file of files)data.items.add(file);if(html)data.setData('text/html',html);if(text)data.setData('text/plain',text);const event=new ClipboardEvent('paste',{clipboardData:data,bubbles:true,cancelable:true});editor.dispatchEvent(event);return event;}
  try{await action({host,toolbar,editor,controller,assets,errors,caret,paste,changes:()=>changes});}finally{controller.destroy();host.remove();getSelection().removeAllRanges();}
}

    const pending=WorkspaceData.copy(initial);WorkspaceData.changeTask(pending,'crash',{title:'Prima della chiusura'});
    pending.preferences.theme='dark';pending.activitiesUpdatedAt=WorkspaceData.nextTime(stamp);pending.preferencesUpdatedAt=WorkspaceData.nextTime(stamp);
    db.seedRecord('meta',{...pending,sequence:1,config:{mode:'folder',handle:folder},compact:false});
    db.seedRecord('activities',{tasks:pending.tasks,tombstones:pending.tombstones});db.seedRecord('general',pending.preferences);db.seedRecord('notes-index',{ids:[],tombstones:{}});
    const reopened=repo(db);await reopened.initialize();assert.equal(reopened.getSnapshot().tasks[0].title,'Prima della chiusura');
    assert.equal(JSON.parse(folder.files.get('spazio-dati/generale.json')).preferences.theme,'dark');assert.equal(db.storedRecords(),1);
  });
  test('conflitto su file invariato: conserva il checkpoint e non conferma la cartella',async()=>{
    const db=memoryIDB(),store=repo(db),folder=new Folder();await store.initialize();await store.mutate(data=>data.tasks.push(task()));await store.switchFolder(folder);
    const external=JSON.stringify({...JSON.parse(folder.files.get('spazio-dati/generale.json')),updatedAt:'2099-01-01T00:00:00.000Z',preferences:{theme:'dark'}});
    folder.afterClose=path=>{if(path==='spazio-dati/attivita.json')folder.files.set('spazio-dati/generale.json',external);};
    await store.mutate(data=>WorkspaceData.changeTask(data,'task-1',{title:'Checkpoint'}));
    assert.equal(store.getConfig().mode,'browser');assert.equal(folder.files.get('spazio-dati/generale.json'),external);
    assert.equal(store.getSnapshot().tasks[0].title,'Checkpoint');assert.ok(db.storedRecords()>1);
  });
  test('IndexedDB e OPFS nativi: trasferimento completo, riavvio e ritorno al browser con binari',async()=>{
    if(!navigator.storage?.getDirectory||!navigator.locks?.request)skip('OPFS o Web Locks non disponibili in questo browser.');
    const root=await navigator.storage.getDirectory(),name='spazio-native-'+crypto.randomUUID(),databaseName=name;
    const directory=await root.getDirectoryHandle(name,{create:true});
    const isolatedDB={open:(_name,version)=>indexedDB.open(databaseName,version),deleteDatabase:()=>indexedDB.deleteDatabase(databaseName)};
    const store=createRepository({indexedDB:isolatedDB,locks:navigator.locks});let reopened;
    try{
      if(typeof directory.queryPermission!=='function'||await directory.queryPermission({mode:'readwrite'})!=='granted')skip('Il browser non concede permessi ai file nativi in questo contesto.');
      await store.initialize();
      const bytes=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgYGD4DwABBAEAX+XDSwAAAABJRU5ErkJggg=='),c=>c.charCodeAt(0)),id=await store.putAsset(new Blob([bytes],{type:'image/png'}));
      await store.mutate(data=>{data.tasks.push(task('native-binary',{note:`<p><img data-asset-id="${id}"></p>`}));data.preferences.theme='dark';});
      await store.switchFolder(directory);
      reopened=createRepository({indexedDB:isolatedDB,locks:navigator.locks});await reopened.initialize();
      assert.equal(reopened.getSnapshot().tasks[0].id,'native-binary');assert.equal(reopened.getSnapshot().preferences.theme,'dark');
      const storage=createFolderStorage(),disk=await storage.read(directory);await reopened.switchBrowser();
      assert.equal(await hashAsset(await reopened.getAsset(id)),id);assert.equal((await storage.read(directory)).raw.activities,disk.raw.activities);
    }finally{await store.resetBrowserData();await root.removeEntry(name,{recursive:true});}
  });
});
}

{
testArea('Manutenzione e nome spazio-dati',()=>{
  for(const operation of ['mutate','switchBrowser'])test(operation+': metadati browser corrotti non attivano il recupero della cartella',async()=>{
    const db=memoryIDB(),store=repo(db);await store.initialize();await store.mutate(data=>data.tasks.push(task()));
    const snapshot=store.getSnapshot(),meta={...snapshot,sequence:2,config:{mode:'non valido',handle:null}};
    db.seedRecord('meta',meta);const writes=db.writeCalls;
    await assert.rejects(operation==='mutate'?store.mutate(data=>WorkspaceData.changeTask(data,'task-1',{title:'Da rifiutare'})):store.switchBrowser());
    assert.equal(db.writeCalls,writes);assert.equal(store.getSnapshot().tasks[0].title,snapshot.tasks[0].title);
    await assert.rejects(repo(db).initialize());
    db.seedRecord('meta',{...meta,config:{mode:'browser',handle:null}});
    const reopened=repo(db);await reopened.initialize();assert.equal(reopened.getSnapshot().tasks[0].title,snapshot.tasks[0].title);
  });
  test('spazio-dati: stesso nome per database e cartella, senza spostare directory precedenti',async()=>{
    const db=memoryIDB(),store=repo(db),folder=new Folder();await store.initialize();
    folder.directories.add('data');folder.files.set('data/promemoria.txt','Da conservare');
    await store.mutate(data=>data.tasks.push(task()));await store.switchFolder(folder);
    assert.equal(db.names.join(','),'spazio-dati');assert.ok(folder.directories.has('spazio-dati'));
    assert.equal(folder.files.get('data/promemoria.txt'),'Da conservare');
    assert.equal(JSON.parse(folder.files.get('spazio-dati/attivita.json')).tasks[0].id,'task-1');
    await store.resetBrowserData();assert.equal(db.deleteCalls.join(','),'spazio-dati');
  });
  test('cartella invariata e modifiche esterne: nessuna riscrittura, aggiornamenti e cancellazioni conservati',async()=>{
    const db=memoryIDB(),store=repo(db),folder=new Folder();await store.initialize();
    await store.mutate(data=>{data.tasks.push(task('one'),task('two'));NotesData.save(data.notes,{...NotesData.create('archive'),id:'shared',title:'Prima'},'');});
    await store.switchFolder(folder);folder.writes=[];const writes=db.writeCalls;
    await store.reload();await store.mutate(()=>{});assert.equal(folder.writes.length,0);assert.equal(db.writeCalls,writes);
    const disk=(await createFolderStorage().read(folder)).data,note=disk.notes.documents[0];
    WorkspaceData.changeTask(disk,'one',{title:'Modifica esterna'});WorkspaceData.changeTask(disk,'two',{deletedAt:stamp});WorkspaceData.purgeTasks(disk,['two']);
    NotesData.save(disk.notes,{...note,title:'Dopo'},note.updatedAt);folder.seed(disk);const general=folder.files.get('spazio-dati/generale.json');
    await store.reload();assert.equal(store.getSnapshot().tasks.length,1);assert.equal(store.getSnapshot().tasks[0].title,'Modifica esterna');
    assert.equal(store.getSnapshot().notes.documents[0].title,'Dopo');assert.ok(store.getSnapshot().tombstones.two);
    assert.equal(folder.files.get('spazio-dati/generale.json'),general);await store.switchBrowser();assert.equal(store.getSnapshot().tasks.length,1);
  });
});
