'use strict';
// Casi di regressione: le funzioni dell'app sono lette da spazio.html dal runner.
window.SpazioTests = function registerSpazioTests(harness) {
const {test,testArea,skip,waitFor,delay} = harness;
async function nativeTestRoot(storage=navigator.storage){
  if(typeof storage?.getDirectory!=='function')skip('OPFS non disponibile in questo browser.');
  try{return await storage.getDirectory();}
  catch(error){
    if(['SecurityError','NotAllowedError'].includes(error.name))skip('Il browser non consente OPFS in questo contesto ('+location.protocol+'). Il test richiede un’origine con accesso allo storage.');
    throw error;
  }
}

function checkExpectedError(error, expected) {
  if (!error || typeof error.message !== 'string') fail('È atteso un oggetto Error.');
  if (expected instanceof RegExp) assert.match(error.message, expected);
  else if (typeof expected === 'string') assert.equal(error.name, expected);
  else if (expected) { if (expected.name) assert.equal(error.name, expected.name); if (expected.message) assert.match(error.message, expected.message); }
  else if (['TypeError','ReferenceError','RangeError','SkippedTest'].includes(error.name)) throw error;
  return error;
}
function fail(message) { throw Error(message); }
const assert = {
  equal(actual, expected, message = '') {
    if (!Object.is(actual, expected)) fail(message || `Atteso ${JSON.stringify(expected)}, ricevuto ${JSON.stringify(actual)}.`);
  },
  ok(value, message = 'Condizione non verificata.') { if (!value) fail(message); },
  match(value, pattern) { if (!pattern.test(value)) fail(`Il testo non corrisponde a ${pattern}.`); },
  throws(action, expected) {
    try { action(); } catch(error) { return checkExpectedError(error, expected); }
    fail('Era atteso un errore, ma l’operazione è riuscita.');
  },
  async rejects(promise, expected) {
    try { await promise; } catch(error) { return checkExpectedError(error, expected); }
    fail('Era atteso un rifiuto, ma l’operazione è riuscita.');
  }
};

const typeText = value => document.execCommand('insertText', false, value);
function pressKey(target, key, options = {}) {
  const event = new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true, ...options });
  target.dispatchEvent(event); return event;
}
function editInput(target, inputType, data = null, options = {}) {
  const event = new InputEvent('beforeinput', { inputType, data, bubbles: true, cancelable: true, ...options });
  target.dispatchEvent(event); return event;
}
function selectText(start, from, end = start, to = from) {
  const range = document.createRange(); range.setStart(start, from); range.setEnd(end, to);
  getSelection().removeAllRanges(); getSelection().addRange(range); return range;
}

const stamp='2026-10-20T10:00:00.000Z';
function task(id='task-1',changes={}){return {id,title:'Preparare il progetto',priority:'high',status:'todo',dueDate:'2026-10-30',note:'<p>Ricerca utenti</p>',createdAt:stamp,updatedAt:stamp,archivedAt:null,deletedAt:null,...changes};}
function dataset(tasks=[]){return {...WorkspaceData.empty(),updatedAt:stamp,tasks};}

function memoryLocks() {
  const tails=new Map();
  return {request(name,options,operation){
    const action=operation||options,job=(tails.get(name)||Promise.resolve()).then(action);
    const tail=job.catch(()=>{});tails.set(name,tail);
    tail.then(()=>{if(tails.get(name)===tail)tails.delete(name);});return job;
  }};
}

// Sostituto transazionale: richieste multiple, isolamento fra connessioni e rollback.
function memoryIDB(){
  const data=new Map(),connections=new Set();
  let fail=false,deletionFailure=false,transactionTail=Promise.resolve();
  const clone=(value,key)=>value===undefined?undefined:key==='meta'?{...value,config:{...value.config}}:structuredClone(value);
  const factory={
    deleteCalls:[],names:[],openCalls:0,writeCalls:0,readKeys:[],writeKeys:[],
    failNextWrite(error=Error('Scrittura rifiutata')){fail=error;},
    failNextDeletion(){deletionFailure=true;},
    storedRecords(){return data.size;},
    seedRecord(key,value){data.set(key,clone(value,key));},
    removeRecord(key){data.delete(key);},
    deleteDatabase(name){
      this.deleteCalls.push(name);const req={};
      queueMicrotask(()=>{
        if(deletionFailure){deletionFailure=false;req.error=Error('Eliminazione non riuscita');req.onerror?.();return;}
        for(const connection of [...connections])connection.onversionchange?.({newVersion:null});
        data.clear();req.onsuccess?.();
      });return req;
    },
    open(name){
      this.openCalls++;this.names.push(name);const req={};
      queueMicrotask(()=>{
        req.result={createObjectStore(){},close(){connections.delete(this);},transaction(_name,mode){
          const previous=transactionTail;let release;
          transactionTail=new Promise(resolve=>release=resolve);
          let pending,aborted=false,operations=0,completion;
          const tx={abort(){if(aborted)return;aborted=true;clearTimeout(completion);release();queueMicrotask(()=>tx.onabort?.());}};
          function finish(){
            clearTimeout(completion);
            completion=setTimeout(()=>{
              if(aborted||operations)return;
              if(mode==='readwrite'&&fail){tx.error=fail;fail=false;tx.abort();return;}
              if(mode==='readwrite'){data.clear();for(const[key,value]of pending)data.set(key,value);}
              release();tx.oncomplete?.();
            });
          }
          function request(action){
            const result={};operations++;previous.then(()=>queueMicrotask(()=>{
              if(aborted)return;pending??=new Map(data);result.result=action(pending);
              result.onsuccess?.();operations--;finish();
            }));return result;
          }
          tx.objectStore=()=>({
            count(){return request(records=>records.size);},
            get(key){factory.readKeys.push(key);return request(records=>clone(records.get(key),key));},
            openCursor(){
              const result={};operations++;let entries,index=0;
              const advance=()=>previous.then(()=>queueMicrotask(()=>{
                if(aborted)return;pending??=new Map(data);entries??=[...pending];const entry=entries[index++];
                result.result=entry?{key:entry[0],value:clone(entry[1],entry[0]),delete:()=>pending.delete(entry[0]),continue:advance}:null;
                result.onsuccess?.();if(!entry){operations--;finish();}
              }));advance();return result;
            },
            delete(key){return request(records=>{records.delete(key);});},
            put(value,key){factory.writeCalls++;factory.writeKeys.push(key);return request(records=>{records.set(key,clone(value,key));return key;});}
          });return tx;
        }};
        connections.add(req.result);req.onupgradeneeded?.();req.onsuccess?.();
      });return req;
    }
  };
  return factory;
}

const missing=()=>new DOMException('Assente','NotFoundError');
class Folder {
  name='Prova';files=new Map();directories=new Set();writes=[];reads=[];bytesWritten=0;failWrite=false;failOn=null;permission='granted';afterClose=null;beforeWrite=null;
  async queryPermission(){return this.permission;}
  seed(data){this.directories.add('spazio-dati');for(const[kind,part]of Object.entries(StorageFiles.encode(data)))this.files.set('spazio-dati/'+StorageFiles.names[kind],JSON.stringify(part));}
  async getDirectoryHandle(name,{create=false}={}){
    if(this.permission!=='granted')throw new DOMException('Permesso revocato','NotAllowedError');
    if(!this.directories.has(name)){if(!create)throw missing();this.directories.add(name);}
    return this.directoryHandle(name);
  }
  directoryHandle(path){const thisFolder=this;return {
    getDirectoryHandle:async(name,{create=false}={})=>{const child=path+'/'+name;if(!this.directories.has(child)){if(!create)throw missing();this.directories.add(child);}return this.directoryHandle(child);},
    getFileHandle:(file,options)=>this.fileHandle(path+'/'+file,options),
    entries:async function*(){for(const key of thisFolder.files.keys())if(key.startsWith(path+'/')&&!key.slice(path.length+1).includes('/'))yield [key.slice(path.length+1),{}];},
    removeEntry:async name=>this.files.delete(path+'/'+name)
  };}
  async getFileHandle(name,options){return this.fileHandle(name,options);}
  async fileHandle(path,{create=false}={}){
    if(!this.files.has(path)){if(!create)throw missing();this.files.set(path,'');}
    const folder=this;
    return {
      async getFile(){folder.reads.push(path);const text=folder.files.get(path);return text instanceof Blob?text:{size:new TextEncoder().encode(text).byteLength,text:async()=>text};},
      async createWritable(){
        if(folder.failWrite||folder.failOn===path)throw Error('Disco non disponibile');
        await folder.beforeWrite?.(path);
        let buffer;
        return {
          async write(value){buffer=value;},
          async close(){folder.files.set(path,buffer);folder.writes.push(path);folder.bytesWritten+=(buffer instanceof Blob?buffer.size:new TextEncoder().encode(buffer).byteLength);await folder.afterClose?.(path);},
          async abort(){}
        };
      }
    };
  }
}
function repo(indexedDB=memoryIDB(),events=[],locks=memoryLocks()){return createRepository({indexedDB,locks,onStatus:(text,error)=>events.push({text,error})});}

{
testArea('Dati e ricerca', () => {
test('validazione: date reali, schema, identificativi e file incompleti',()=>{
  assert.equal(WorkspaceData.validate(dataset([task()])).tasks.length,1);
  for(const dueDate of ['2026-02-30','2026-13-01','test'])assert.throws(()=>WorkspaceData.validate(dataset([task('bad',{dueDate})])));
  assert.throws(()=>WorkspaceData.validate({...dataset(),version:2}));assert.throws(()=>WorkspaceData.validate(dataset([task(),task()])));
});
test('unione: nessun duplicato, vince la modifica recente, eliminazioni rispettate',()=>{
  const a=dataset([task()]),b=dataset([task('task-1',{title:'Aggiornato',updatedAt:'2026-10-21T10:00:00.000Z'}),task('task-2')]);
  const merged=WorkspaceData.merge(a,b);assert.equal(merged.tasks.length,2);assert.equal(merged.tasks[0].title,'Aggiornato');
  a.tombstones['task-1']='2026-10-22T10:00:00.000Z';assert.equal(WorkspaceData.merge(a,b).tasks.length,1);
});
test('archivio e cestino congelano i valori; il ripristino conserva lo stato',()=>{
  const data=dataset([task()]);WorkspaceData.changeTask(data,'task-1',{archivedAt:stamp});
  assert.throws(()=>WorkspaceData.changeTask(data,'task-1',{priority:'low'}));assert.throws(()=>WorkspaceData.changeTask(data,'task-1',{dueDate:''}));
  WorkspaceData.changeTask(data,'task-1',{deletedAt:stamp});WorkspaceData.changeTask(data,'task-1',{deletedAt:null});assert.equal(data.tasks[0].archivedAt,stamp);
  WorkspaceData.changeTask(data,'task-1',{archivedAt:null});assert.equal(data.tasks[0].status,'todo');assert.equal(data.tasks[0].dueDate,'2026-10-30');
});
test('ricerca, filtri combinati, intervallo inclusivo e date vuote in fondo',()=>{
  const data=dataset([task('one'),task('two',{dueDate:'',priority:'low'}),task('three',{dueDate:'2026-10-21',archivedAt:stamp})]);
  const view={scope:'active',query:'"progetto" AND "alta"',priority:['high'],rangeStart:'2026-10-30',rangeEnd:'2026-10-30'};
  assert.equal(WorkspaceData.selectTasks(data,view).length,1);
  assert.equal(WorkspaceData.selectTasks(data,{scope:'archive'}).length,1);
  for(const direction of ['ascending','descending'])assert.equal(WorkspaceData.selectTasks(data,{scope:'active',sortKey:'dueDate',direction}).at(-1).id,'two');
});
test('indice ricerca: si aggiorna se titolo o nota cambiano sullo stesso oggetto',()=>{
  const data=dataset([task()]);const view={scope:'active',query:'ricerca'};assert.equal(WorkspaceData.selectTasks(data,view).length,1);
  data.tasks[0].note='Altro contenuto';assert.equal(WorkspaceData.selectTasks(data,view).length,0);
  data.tasks[0].title='Ricerca nuova';assert.equal(WorkspaceData.selectTasks(data,view).length,1);
});

test('stato in attesa: transizioni, validazione e ripristino conservano i dati esistenti',()=>{
  const data=dataset([task()]);
  for(const status of ['todo','progress','completed']){
    WorkspaceData.changeTask(data,'task-1',{status:'waiting'});
    assert.equal(WorkspaceData.validate(data).tasks[0].status,'waiting');
    WorkspaceData.changeTask(data,'task-1',{status});
    assert.equal(WorkspaceData.validate(data).tasks[0].status,status);
  }
  WorkspaceData.changeTask(data,'task-1',{status:'waiting',archivedAt:stamp});
  WorkspaceData.changeTask(data,'task-1',{deletedAt:stamp});
  WorkspaceData.changeTask(data,'task-1',{deletedAt:null,archivedAt:null});
  assert.equal(data.tasks[0].status,'waiting');
  assert.equal(data.tasks[0].title,'Preparare il progetto');
  assert.equal(data.tasks[0].note,'<p>Ricerca utenti</p>');
  assert.throws(()=>WorkspaceData.validate(dataset([task('invalid',{status:'unknown'})])));
});

test('stato in attesa: ricerca aggiornata, filtri combinati e ordinamento in entrambe le direzioni',()=>{
  const data=dataset([
    task('completed',{status:'completed'}),task('waiting',{status:'waiting'}),
    task('progress',{status:'progress'}),task('todo'),
    task('low',{status:'waiting',priority:'low',dueDate:''}),
    task('archived',{status:'waiting',archivedAt:stamp}),
    task('deleted',{status:'waiting',deletedAt:stamp})
  ]);
  const ids=view=>WorkspaceData.selectTasks(data,view).map(item=>item.id).join(',');
  assert.equal(ids({scope:'active',query:'"in attesa"'}),'waiting,low');
  assert.equal(ids({scope:'active',status:['waiting'],priority:['high'],rangeStart:'2026-10-30',rangeEnd:'2026-10-30'}),'waiting');
  assert.equal(ids({scope:'active',status:['waiting','progress'],sortKey:'status',direction:'ascending'}),'progress,low,waiting');
  assert.equal(ids({scope:'active',sortKey:'status',direction:'ascending'}),'todo,progress,low,waiting,completed');
  assert.equal(ids({scope:'active',sortKey:'status',direction:'descending'}),'completed,low,waiting,progress,todo');
  assert.equal(ids({scope:'archive',status:['waiting']}),'archived,deleted');
  assert.equal(ids({scope:'trash',status:['waiting']}),'deleted');
  WorkspaceData.changeTask(data,'waiting',{status:'progress'});
  assert.equal(ids({scope:'active',query:'"in attesa"'}),'low');
  WorkspaceData.changeTask(data,'todo',{status:'waiting'});
  assert.equal(ids({scope:'active',query:'attesa'}),'todo,low');
});

test('ricerca: tutti gli esempi della guida rispettano parole, AND e frasi esatte',()=>{
  const data=dataset([
    task('monthly',{title:'Report mensile',note:'<p>Urgente</p>'}),
    task('urgent',{title:'Report urgente',note:''}),
    task('separate',{title:'Report del riepilogo mensile',note:''}),
    task('other',{title:'Telefonare',note:'<p>Urgente</p>'})
  ]);
  const cases=[
    ['report','monthly,urgent,separate'],
    ['report urgente','monthly,urgent'],
    ['report AND urgente','monthly,urgent'],
    ['"report mensile"','monthly'],
    ['urgente "report mensile"','monthly']
  ];
  for(const[query,expected]of cases)assert.equal(WorkspaceData.selectTasks(data,{scope:'active',query}).map(item=>item.id).join(','),expected);
  for(const query of ['alta','"da fare"','2026-10-30'])assert.equal(WorkspaceData.selectTasks(data,{scope:'active',query}).length,4);
});
});
}

testArea('Persistenza e recupero', () => {
test('persistenza e coda: ricaricamento e modifiche concorrenti conservate',async()=>{
  const db=memoryIDB(),store=repo(db);await store.initialize();
  await Promise.all([store.mutate(data=>data.tasks.push(task('one'))),store.mutate(data=>data.tasks.push(task('two')))]);
  const reopened=repo(db);await reopened.initialize();assert.equal(reopened.getSnapshot().tasks.length,2);
});
test('stato in attesa: riapertura, backup e trasferimento cartella preservano tutti gli stati',async()=>{
  const db=memoryIDB(),store=repo(db);await store.initialize();
  await store.mutate(data=>data.tasks.push(...['todo','progress','waiting','completed'].map(status=>task(status,{status}))));
  const reopened=repo(db);await reopened.initialize();
  const states=data=>data.tasks.map(item=>item.status).join(',');
  const expected='todo,progress,waiting,completed';
  assert.equal(states(reopened.getSnapshot()),expected);
  const backup=JSON.parse(JSON.stringify(reopened.getSnapshot()));
  assert.equal(states(WorkspaceData.merge(dataset(),backup)),expected);
  const folder=new Folder();await reopened.switchFolder(folder);
  assert.equal(JSON.parse(folder.files.get('spazio-dati/attivita.json')).tasks.find(item=>item.id==='waiting').status,'waiting');
  await reopened.switchBrowser();await reopened.switchFolder(folder);
  assert.equal(states(reopened.getSnapshot()),expected);
  await reopened.mutate(data=>WorkspaceData.changeTask(data,'waiting',{status:'progress'}));
  assert.equal(JSON.parse(folder.files.get('spazio-dati/attivita.json')).tasks.find(item=>item.id==='waiting').status,'progress');
});
test('browser → cartella → browser: unione, rilettura, note e archivio',async()=>{
  const store=repo();await store.initialize();await store.mutate(data=>data.tasks.push(task('one')));
  const folder=new Folder();folder.seed(dataset([task('two',{archivedAt:stamp})]));
  await store.switchFolder(folder);assert.equal(store.getConfig().mode,'folder');assert.equal(store.getSnapshot().tasks.length,2);
  await store.mutate(data=>WorkspaceData.changeTask(data,'one',{note:'<p><strong>Nota</strong></p>'}));assert.match(folder.files.get('spazio-dati/attivita.json'),/strong/);
  await store.switchBrowser();assert.equal(store.getConfig().mode,'browser');assert.equal(store.getSnapshot().tasks[1].archivedAt,stamp);
  await store.switchFolder(folder);assert.equal(store.getSnapshot().tasks.length,2);

async function imageFile(name='foto.png',width=120,height=60){
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  const context=canvas.getContext('2d');context.fillStyle='#d8a34b';context.fillRect(0,0,width,height);
  return new File([await new Promise(resolve=>canvas.toBlob(resolve,'image/png'))],name,{type:'image/png'});
}
async function withNoteEditor(action,options={}){
  const host=document.createElement('div');host.className='shared-editor-host';host.style.cssText='position:relative;height:420px;display:flex;flex-direction:column';
  host.innerHTML='<div class="note-toolbar"></div><div class="note-editor" style="min-height:200px" role="textbox" contenteditable="true"></div>';document.body.append(host);
  const [toolbar,editor]=host.children,assets=new Map(),errors=[];let changes=0;
  const repository={getAsset:async id=>assets.get(id),putAsset:async blob=>{const id=await hashAsset(blob);assets.set(id,blob);return id;},...options.repository};
  const controller=createNoteEditor({editor,toolbar,getRepository:()=>repository,onError:error=>errors.push(error),onChange:()=>changes++,...options});
  function caret(node=editor,offset=node.nodeType===3?node.length:node.childNodes.length){editor.focus();selectText(node,offset);}
  function paste(files=[],html='',text=''){const data=new DataTransfer();for(const file of files)data.items.add(file);if(html)data.setData('text/html',html);if(text)data.setData('text/plain',text);const event=new ClipboardEvent('paste',{clipboardData:data,bubbles:true,cancelable:true});editor.dispatchEvent(event);return event;}
  try{await action({host,toolbar,editor,controller,assets,errors,caret,paste,changes:()=>changes});}finally{controller.destroy();host.remove();getSelection().removeAllRanges();}
}

// Flussi sull'HTML e sui gestori effettivi dell'app, con IndexedDB simulato.
// La factory viene sostituita soltanto nel nuovo iframe: nessun DB utente aperto.
function applicationTest(name, action, seed = [], options = {}) {
  test(name, async () => {
    const NativeDate=window.Date,NativeInterval=window.setInterval,intervals=[];let instant=options.now?new NativeDate(options.now).getTime():null;
    if(options.intervals)window.setInterval=(callback,milliseconds)=>{intervals.push({callback,milliseconds});return intervals.length;};
    if(instant!==null)window.Date=class extends NativeDate{constructor(...args){super(...(args.length?args:[instant]));}static now(){return instant;}};
    try {
    const db = memoryIDB();
    if (typeof seed==='function'||seed.length) { const initial = repo(db); await initial.initialize(); await initial.mutate(data => typeof seed==='function'?seed(data):data.tasks.push(...seed)); }
    Object.defineProperty(window, 'indexedDB', { configurable: true, value: db });
    await harness.startApplication();
    const find = selector => {
      const element = document.querySelector(selector);
      assert.ok(element, 'Elemento assente: ' + selector); return element;
    };
    const idle = () => waitFor(() => !document.body.classList.contains('is-busy'), 'Completamento azione');
    const click = async (selector, wait = true) => { const element = find(selector); assert.equal(element.disabled, false, selector + ' è disabilitato.'); element.click(); if (wait) await idle(); };
    const input = (selector, value) => { const element = find(selector); element.value = value; element.dispatchEvent(new Event('input', { bubbles: true })); return element; };
    const write = (selector, html) => { const editor = find(selector); editor.focus(); editor.innerHTML = html; editor.dispatchEvent(new InputEvent('input', { inputType: 'insertText', bubbles: true })); };
    const snapshot = async () => { const reopened = repo(db); await reopened.initialize(); return reopened.getSnapshot(); };
    const resize = async (width, height) => { frameElement.style.width = width + 'px'; frameElement.style.height = height + 'px'; await waitFor(() => innerWidth === width && innerHeight === height, 'Ridimensionamento ambiente'); };
    await action({ find, idle, click, input, write, snapshot, resize, db, clock:value=>{instant=new NativeDate(value).getTime();}, tick:()=>intervals.filter(item=>item.milliseconds===60000).forEach(item=>item.callback()) });
    } finally {window.Date=NativeDate;window.setInterval=NativeInterval;}
  }, { application: true });
}

testArea('Integrità e sicurezza',()=>{
  test('sanitizzazione: contenuti attivi, URL locali e remoti, namespace e attributi restano inerti',()=>{
    const id='a'.repeat(64),payloads=['<script>alert(1)<\/script><p>Testo</p>','<svg><foreignObject><div onload="alert(1)">Testo</div></foreignObject></svg>','<math><mtext><img src=x onerror=alert(1)></mtext></math>','<iframe srcdoc="<script>alert(1)<\/script>"></iframe>','<form action="https://example.invalid"><input autofocus onfocus="alert(1)"><p>Testo</p></form>','<a href="javascript:alert(1)">Testo</a><img src="file:///etc/passwd">',`<figure onclick="alert(1)"><img data-asset-id="${id}" src="https://example.invalid/a" srcset="x 1x" onerror="alert(1)" style="background:url(x)" alt="&quot; onload=&quot;alert(1)"></figure>`];
    for(const html of payloads){const clean=sanitizeNote(html),root=document.createElement('div');root.innerHTML=clean;assert.equal(root.querySelector('script,style,iframe,object,embed,svg,math,form,input,a'),null);for(const node of root.querySelectorAll('*'))for(const attribute of node.attributes){assert.ok(!/^on/i.test(attribute.name));assert.ok(!['src','srcset','href','srcdoc','action'].includes(attribute.name));}assert.equal(sanitizeNote(clean),clean,'La sanitizzazione deve essere stabile anche dopo la riapertura.');}
  });
  test('importazione: identificativi e registri delle eliminazioni non possono inquinare i prototipi',()=>{
    for(const id of ['__proto__','constructor','prototype']){const data=dataset([task(id)]);assert.throws(()=>WorkspaceData.validate(data));const tombstone=dataset();tombstone.tombstones=JSON.parse('{"'+id+'":"2026-10-20T10:00:00.000Z"}');assert.throws(()=>WorkspaceData.validate(tombstone));}assert.equal(({}).polluted,undefined);
  });

    const board=BoardData.create();board.elements=[{id:'etichetta',type:'text',x:10,y:20,width:300,height:60,color:'neutral',text:'<script>alert(1)<\/script><image href="file:///etc/passwd"/>',rotation:0,fill:'none'}];const svg=BoardDrawing.scene(board,true),serialized=new XMLSerializer().serializeToString(svg);assert.equal(svg.querySelector('script,image,foreignObject,a'),null);assert.ok(svg.textContent.includes('<script>'));assert.ok(serialized.includes('&lt;script&gt;'));const parsed=new DOMParser().parseFromString(serialized,'image/svg+xml');assert.equal(parsed.querySelector('parsererror'),null);

'use strict';

const areas = ['Generale', 'Attività', 'Note', 'Lavagne'];
const activityGroups = new Set(['Dati e ricerca', 'Titoli delle attività', 'Calendario e scadenze', 'Interfaccia attività']);
const noteGroups = new Set(['Editor delle note', 'Journal, Archivio e allegati', 'Editor minimale e immagini', 'Interfaccia note', 'Navigazione note e barre laterali']);
function category(group, name) {
  if(/lavagne/.test(group))return 'Lavagne';
  if (activityGroups.has(group)) return 'Attività';
  if (noteGroups.has(group) || /^(nota:|note:|note ostili:)/.test(name)) return 'Note';
  return 'Generale';
}
function catalog(register) {
  let group = '';
  const cases = [];
  register({
    testArea(name, define) { const previous = group; group = name; try { define(); } finally { group = previous; } },
    test(name, action, options = {}) { cases.push({ id: cases.length, name, group, area: category(group, name), action, ...options }); }
  });
  return cases;
}

function errorText(error) {
  const description = error?.message ? (error.name || 'Error') + ': ' + error.message : String(error);
  const stack = String(error?.stack || '');
  return stack.startsWith(description) ? stack : description + (stack ? '\n' + stack : '');
}

function protectTestStorage(token, errorText) {
  const fail = event => {
    const error = event.error || event.reason || Error(event.message || 'Errore nello script applicativo.');
    parent.postMessage({ type: 'spazio-test', token, outcome: 'failed', error: errorText(error) }, '*');
  };
  window.addEventListener('error', fail);
  window.addEventListener('unhandledrejection', fail);
  const native = window.indexedDB;
  if (!native) return;
  const checked = name => {
    if (!/^spazio-(test|native)-/.test(name)) throw Error('Accesso a un database non di test bloccato: ' + name);
  };
  Object.defineProperty(window, 'indexedDB', { configurable: true, value: {
    open(name, version) { checked(name); return version === undefined ? native.open(name) : native.open(name, version); },
    deleteDatabase(name) { checked(name); return native.deleteDatabase(name); }
  } });
}

// Definita nella closure dello script originale, senza esportazioni nell'app.
// Ogni caso vive in un nuovo documento, eliminato anche in caso di timeout.
async function executeCase(register, selected, token, errorText) {
  const send = result => parent.postMessage({ type: 'spazio-test', token, ...result }, '*');
  const cases = [];
  let globalFailure = null;
  const capture = event => {
    globalFailure = event.error || event.reason || Error(event.message || 'Errore globale del test.');
    event.preventDefault();
  };
  window.addEventListener('error', capture);
  window.addEventListener('unhandledrejection', capture);
  const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
  const waitFor = async (condition, label = 'Condizione attesa', timeout = 4000) => {
    const limit = performance.now() + timeout;
    while (!condition()) {
      if (performance.now() >= limit) throw Error(label + ': tempo massimo superato.');
      await delay(16);
    }
  };
  try {
    register({
      testArea(_name, define) { define(); },
      test(name, action) { cases.push({ name, action }); },
      skip(reason) { const error = Error(reason); error.name = 'SkippedTest'; throw error; },
      delay, waitFor, errorText,
      async startApplication() {
        startApp();
        await waitFor(() => !app.initializing, 'Avvio applicazione');
        if (!app.storageReady) throw Error(document.getElementById('error-text').textContent || 'Archivio non pronto.');
      },
      async flushApplication() { await flushEditors(); await app.repository.flush(); }
    });
    if (!cases[selected]) throw Error('Caso di test inesistente: ' + selected);
    await cases[selected].action();
    await delay(0); // Raccoglie anche le promesse rifiutate senza gestione.
    if (globalFailure) throw globalFailure;
    send({ outcome: 'passed' });
  } catch (error) {
    send({ outcome: error?.name === 'SkippedTest' && !globalFailure ? 'skipped' : 'failed', error: errorText(error) });
  }
}


const cases = catalog(window.SpazioTests);
let source = null, running = false;
const copyIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';

// La pagina vicina risponde prima dell'avvio dell'app: nessuna lettura dei dati.
function readApplication() {
  return new Promise((resolve, reject) => {
    const frame = document.createElement('iframe'), token = crypto.randomUUID();
    frame.className = 'test-fixture'; frame.title = 'Lettura di spazio.html';
    const url = new URL('spazio.html', location.href); url.searchParams.set('_spazio_test', token); url.hash = 'spazio-test-source=' + token;
    let timer, finished = false;
    const finish = (error, html) => {
      if (finished) return; finished = true; clearTimeout(timer);
      window.removeEventListener('message', receive); frame.remove();
      error ? reject(error) : resolve(html);
    };
    const receive = event => {
      if (event.source === frame.contentWindow && event.data?.type === 'spazio-test-source' && event.data.token === token && typeof event.data.html === 'string') finish(null, event.data.html);
    };
    window.addEventListener('message', receive);
    timer = setTimeout(() => finish(Error('Impossibile leggere spazio.html. Verifica che sia nella stessa cartella di test.html e che entrambi i file siano aggiornati.')), 10000);
    frame.src = url.href; document.body.append(frame);
  });
}
async function loadSource(html) {
  const parsed = new DOMParser().parseFromString(html, 'text/html');
  const script = parsed.querySelector('script#workspace-app')?.textContent;
  if (!script || script.split('\nstartApp();\n').length !== 2 || !/\}\)\(\);\s*$/.test(script)) throw Error('Struttura dello script di spazio.html non riconosciuta.');
  const policy=parsed.querySelector('meta[http-equiv="Content-Security-Policy"]')?.content||'';
  const digest=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(script)))));
  if(!policy.includes("script-src '"+"sha256-"+digest+"'")||/script-src[^;]*(?:unsafe-inline|unsafe-eval)/.test(policy))throw Error('La CSP di spazio.html non corrisponde allo script o consente esecuzione non sicura.');
  parsed.querySelectorAll('script').forEach(element => element.remove());
  const styles = [...parsed.querySelectorAll('style')].map(style => style.textContent).join('\n'), body = parsed.body.innerHTML;
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(script + styles + body)))].map(value => value.toString(16).padStart(2, '0')).join('');
  source = { script: script.replace('\nstartApp();\n', '\n// Avvio gestito esclusivamente dalla fixture isolata.\n'), styles, body, hash };
}
function isolatedTest(item) {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    frame.className = 'test-fixture'; frame.title = 'Ambiente isolato: ' + item.name;
    const token = crypto.randomUUID();
    let finished = false, timer;
    const finish = result => {
      if (finished) return;
      finished = true; clearTimeout(timer); window.removeEventListener('message', receive);
      frame.remove(); URL.revokeObjectURL(url); URL.revokeObjectURL(guardUrl); resolve(result);
    };
    const receive = event => {
      if (event.source === frame.contentWindow && event.data?.type === 'spazio-test' && event.data.token === token) finish(event.data);
    };
    const call = '\n(' + executeCase.toString() + ')(' + window.SpazioTests.toString() + ',' + item.id + ',' + JSON.stringify(token) + ',' + errorText.toString() + ');\n';
    const script = source.script.replace(/\}\)\(\);\s*$/, call + '})();');
    const url = URL.createObjectURL(new Blob([script], { type: 'text/javascript' }));
    const guardUrl = URL.createObjectURL(new Blob(['(' + protectTestStorage.toString() + ')(' + JSON.stringify(token) + ',' + errorText.toString() + ');'], { type: 'text/javascript' }));
    frame.srcdoc = '<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><style>' + source.styles + '</style></head><body>' + (item.application ? source.body : '') + '<script src="' + guardUrl + '"><\/script><script src="' + url + '"><\/script></body></html>';
    window.addEventListener('message', receive);
    timer = setTimeout(() => finish({ outcome: 'failed', error: 'Timeout dopo 15 secondi. Ambiente del test distrutto.' }), 15000);
    document.body.append(frame);
  });
}
function countText(result) { return result.passed + ' superati · ' + result.failed + ' falliti · ' + result.skipped + ' non eseguibili'; }
function resultText(report, results) {
  return ['Test di Spazio', 'Versione: ' + (report.hash || 'non letta'), 'Browser: ' + report.userAgent, 'Contesto: ' + report.protocol, countText(report), '', ...results.map(item => '[' + item.area + ' / ' + item.group + '] ' + item.name + '\n' + (item.error || '') + '\n')].join('\n');
}
async function copyText(text, button) {
  const status = button.closest('section').querySelector('.copy-status');
  try {
    let copied = false;
    if (navigator.clipboard?.writeText) { try { await navigator.clipboard.writeText(text); copied = true; } catch {} }
    if (!copied) {
      const field = document.createElement('textarea'); field.value = text; field.style.cssText = 'position:fixed;left:-10000px;top:0';
      document.body.append(field);
      try { field.select(); if (!document.execCommand('copy')) throw Error('Copia non disponibile. Seleziona e copia i dettagli del test.'); }
      finally { field.remove(); button.focus({ preventScroll: true }); }
    }
    status.textContent = 'Dettagli copiati';
  } catch (error) { status.textContent = error.message; }
}
function resultRow(item) {
  const row = document.createElement('li'); row.dataset.result = item.outcome;
  const heading = document.createElement('div'); heading.className = 'result-heading';
  const label = document.createElement('span'); label.textContent = ({ passed: '✓ ', failed: '× ', skipped: '— ' })[item.outcome] + item.name; heading.append(label);
  row.append(heading);
  const detail = document.createElement('small'); detail.textContent = item.group + ' · ' + item.duration + ' ms'; row.append(detail);
  if (item.error) {
    const details = document.createElement('details'), reason = document.createElement('summary'), text = document.createElement('pre');
    reason.textContent = item.outcome === 'skipped' ? 'Motivo della mancata esecuzione' : 'Dettagli'; text.textContent = item.error;
    details.append(reason, text); row.append(details);
  }
  return row;
}
async function runTests() {

  button.disabled = copy.disabled = copySkipped.disabled = true;
  const summary = document.getElementById('test-summary'), list = document.getElementById('test-list'), failures = document.getElementById('test-failure-list'), failureSection = document.getElementById('test-failures');
  const skipped = document.getElementById('test-skipped-list'), skippedSection = document.getElementById('test-skipped');

  document.querySelectorAll('.copy-status').forEach(status => status.textContent = '');
  summary.dataset.result = 'running'; summary.textContent = 'Preparazione…'; document.title = 'Test in corso — Spazio';
  const requested = new URLSearchParams(location.search).get('case');
  const selected = cases.filter(item => requested === null || item.id === Number(requested));
  const report = { hash: null, userAgent: navigator.userAgent, protocol: location.protocol, capabilities: { indexedDB: !!window.indexedDB, opfs: !!navigator.storage?.getDirectory, locks: !!navigator.locks?.request, folderPicker: !!window.showDirectoryPicker }, passed: 0, failed: 0, skipped: 0, results: [] };

    if (!selected.length) throw Error('Nessun test corrisponde alla selezione.');
    for (const area of areas) {

      const section = document.createElement('details'); section.className = 'test-group';
      section.innerHTML = '<summary><strong></strong><span></span></summary><ol></ol>';
      section.querySelector('strong').textContent = area; list.append(section);

      report.results.push(entry); group.list.append(resultRow(entry)); group.status.textContent = countText(group);

    summary.dataset.result = report.failed ? 'failed' : report.skipped ? 'incomplete' : 'passed';
    summary.textContent = countText(report) + (report.skipped ? ' · Verifica incompleta' : '');
    document.title = (report.failed ? 'Test falliti' : report.skipped ? 'Test incompleti' : 'Test superati') + ' — Spazio';

    report.results.push(entry); failureSection.hidden = false; failures.append(resultRow(entry));
